name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    name: API — lint, type, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bhv
          POSTGRES_PASSWORD: bhv
          POSTGRES_DB: bhv
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U bhv -d bhv"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://bhv:bhv@localhost:5433/bhv
      TEST_DATABASE_URL: postgresql+psycopg://bhv:bhv@localhost:5433/bhv_test
      APP_ENV: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pytest — DB, unit, E2E API lokal (Postgres asli)
        run: uv run pytest
      - name: Kontrak OpenAPI frontend up-to-date
        run: |
          uv run bhv openapi --out /tmp/openapi.json
          diff -u ../web/openapi.json /tmp/openapi.json || (echo "::error::apps/web/openapi.json basi. Jalankan 'pnpm gen:api' di apps/web lalu commit." && exit 1)
      - name: Migrasi + rekonsiliasi stok
        run: |
          uv run bhv migrate
          uv run bhv check-stock

  e2e-stack:
    name: E2E API — Docker stack
    runs-on: ubuntu-latest
    needs: api
    env:
      E2E_BASE_URL: http://localhost:8000
      E2E_ADMIN_EMAIL: e2e-admin@bhavia-e2e.com
      E2E_ADMIN_PASSWORD: E2e-Admin-Pass1
      E2E_DATABASE_URL: postgresql://bhv:bhv@localhost:5433/bhv
      COMPOSE: docker compose -f infra/docker-compose.yml --profile full
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
          python-version: "3.12"
      - name: Build & start stack (image produksi)
        run: $COMPOSE up -d --build --wait
      - name: Buat admin lewat CLI di container
        run: >-
          $COMPOSE exec -T api bhv create-admin
          --email "$E2E_ADMIN_EMAIL" --name "E2E Admin" --password "$E2E_ADMIN_PASSWORD"
      - name: Seed data contoh (CLI di container)
        run: $COMPOSE exec -T api bhv seed
      - name: Install test deps
        working-directory: apps/api
        run: uv sync --frozen
      - name: E2E API (HTTP ke container)
        working-directory: apps/api
        run: uv run pytest tests/api -v
      - name: Rekonsiliasi stok setelah E2E
        run: $COMPOSE exec -T api bhv check-stock
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs
      - name: Teardown
        if: always()
        run: $COMPOSE down -v

  web:
    name: Web — lint, type, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tipe API dari openapi.json up-to-date
        run: |
          pnpm exec openapi-typescript openapi.json -o /tmp/schema.d.ts
          diff -u src/lib/api/schema.d.ts /tmp/schema.d.ts || (echo "::error::schema.d.ts basi. Jalankan 'pnpm gen:api'." && exit 1)
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          API_ORIGIN: http://localhost:8000

  e2e-web:
    name: E2E Web — Playwright + stack Docker
    runs-on: ubuntu-latest
    needs: [api, web]
    env:
      E2E_ADMIN_EMAIL: e2e-admin@bhavia-e2e.com
      E2E_ADMIN_PASSWORD: E2e-Admin-Pass1
      API_ORIGIN: http://localhost:8000
      COMPOSE: docker compose -f infra/docker-compose.yml --profile full
    steps:
      - uses: actions/checkout@v4
      - name: Start API + DB (image produksi)
        run: $COMPOSE up -d --build --wait
      - name: Admin E2E
        run: >-
          $COMPOSE exec -T api bhv create-admin
          --email "$E2E_ADMIN_EMAIL" --name "E2E Admin" --password "$E2E_ADMIN_PASSWORD"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install & build web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        run: pnpm e2e
      - name: Rekonsiliasi stok setelah E2E
        run: $COMPOSE exec -T api bhv check-stock
      - name: Upload laporan Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Logs API on failure
        if: failure()
        run: $COMPOSE logs api
      - name: Teardown
        if: always()
        run: $COMPOSE down -v
