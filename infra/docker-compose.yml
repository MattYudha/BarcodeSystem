# Lokal & CI. Jalankan lewat scripts/dc.ps1 (Windows, Docker Engine di WSL) atau scripts/dc.sh.
#   dev  : hanya Postgres  -> scripts/dc.ps1 up -d
#   full : db + api (+ web nanti) dari image -> scripts/dc.ps1 --profile full up -d --build
name: bhavia

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhv}
      POSTGRES_DB: ${POSTGRES_DB:-bhv}
      TZ: UTC
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhv}:${POSTGRES_PASSWORD:-bhv}@db:5432/${POSTGRES_DB:-bhv}
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUN_MIGRATIONS: "1"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db_data:
