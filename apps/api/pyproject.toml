[project]
name = "bhv-api"
version = "0.1.0"
description = "API Sistem Inventaris Barcode Bhavia International Tailor"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pwdlib[argon2]>=0.2.1",
    "python-barcode>=0.15.1",
    "reportlab>=4.2",
    "typer>=0.12",
]

[project.scripts]
bhv = "bhv.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bhv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["bhv"]
known-third-party = ["alembic"]   # folder alembic/ lokal jangan dianggap first-party

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
